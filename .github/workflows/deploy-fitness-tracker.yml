name: Deploy VitalSync to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'fitness-tracker/**'
      - '.github/workflows/deploy-fitness-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fitness-tracker/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: fitness-tracker/dist
          publish_branch: gh-pages
          force_orphan: true
